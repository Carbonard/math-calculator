<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="styles.css">
	<!-- <script src="calculator.js"></script> -->
</head>
<body>

<form class="centered" id="inputForm">
	<input id="expr" type="text">
	<button id="solveBtn">Solve</button>
</form>

<pre class="centered" id="output"></pre>
<div class="centered"><pre class="error" id="outputError">aqui</pre></div>

<script>
	const errMessages =
	{
		en:
		{
			1 : "unopened parenthesis",
			2 : "missing opening parenthesis",
			3 : "operation with no operands",
			4 : "missing operation",
			5 : "undefined token"
		},
	}
	let language = "en";
	var Module =
	{
		print(text)
		{
			document.getElementById("output").textContent += text + "\n";
		},
		printErr(errOutput)
		{
		try
		{
			let text = "";
			let errData = JSON.parse(errOutput);
			text += "Syntax error: "
			text += errMessages[language][errData.code] + "\n";
			text += errData.input + "\n";
			for (let i = 0; i < errData.index; i++)
			{
				text += ' ';
			}
			text += "^";
			document.getElementById("outputError").textContent = text + "\n";
		}
		catch (e)
		{
			console.error("Invalid JSON:", errOutput);
			return;
		}	
		}
	};
</script>

<script src="calculator.js"></script>

<script>
	function solve()
	{
		document.getElementById("output").innerHTML = "";
		document.getElementById("outputError").innerHTML = "";
		var expr = document.getElementById("expr").value;
		let ptr = Module.ccall('manage_input', "number", ['string'], [expr]);
		let aux = UTF8ToString(ptr);
		Module._free(ptr);
		json = JSON.parse(aux);
		if (json.status === "syntax_error")
			Module.printErr(aux);

	}

	document.getElementById("inputForm").addEventListener("submit", function(event)
	{
		event.preventDefault(); // evita que recargue la página
		solve();
	});
	document.getElementById("solveBtn").addEventListener("click", solve);
</script>


</body>
</html>
